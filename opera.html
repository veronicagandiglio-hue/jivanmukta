<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Opera — Advaita Vedānta</title>

<!--
  ============================================================
  TEMPLATE DINAMICO — Pagina di Opera (tipo WORK)
  ============================================================
  Sostituisce le pagine statiche individuali per singola opera
  (es. opera-brhadaranyaka.html): non esiste più una pagina HTML
  distinta per ogni opera, esiste questo unico template dinamico.

  Il contenuto è determinato dallo slug in query string:
      opera.html?rif=<id-opera>

  Il markup non contiene contenuti hardcoded. I dati provengono
  esclusivamente da js/content-engine.js.
  ============================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gentium+Plus:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

<style>
:root{
  --color-bg:        #F5F3EE;
  --color-bg-raised: #EFECE3;
  --color-ink:        #201F1C;
  --color-ink-muted:  #5B584E;
  --color-ink-faint:  #8B8778;
  --color-accent:     #45516C;
  --color-rule:       #D9D4C6;

  --font-text: 'Gentium Plus', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;

  --fs-question:  clamp(2rem, 4.5vw + 1rem, 3.4rem);
  --fs-title:     1.375rem;
  --fs-body:      1.125rem;
  --fs-note:      0.95rem;
  --fs-caption:   0.85rem;

  --lh-tight:  1.25;
  --lh-body:   1.7;

  --sp-1: 0.375rem;
  --sp-2: 0.75rem;
  --sp-3: 1.25rem;
  --sp-4: 2rem;
  --sp-5: 3.25rem;
  --sp-6: 5rem;
  --sp-7: 7.5rem;

  --measure:   38rem;
  --page-max:  60rem;
}

*, *::before, *::after{ box-sizing: border-box; }
html{ -webkit-text-size-adjust: 100%; }
body{ margin: 0; }
ul, ol{ margin: 0; padding: 0; list-style: none; }
a{ color: inherit; }
h1,h2,p,dl,dd,dt{ margin: 0; }

body{
  background: var(--color-bg);
  color: var(--color-ink);
  font-family: var(--font-text);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  font-feature-settings: "onum" 1, "liga" 1;
}

.eyebrow{
  font-size: var(--fs-caption);
  color: var(--color-ink-faint);
  font-style: italic;
}

.page{
  display: grid;
  grid-template-columns: minmax(var(--sp-3), 1fr) minmax(0, var(--page-max)) minmax(var(--sp-3), 1fr);
  padding-block: var(--sp-5) var(--sp-7);
}
.page > *{ grid-column: 2; }
.measure{ max-width: var(--measure); margin-inline: auto; }
.block + .block{ margin-top: var(--sp-6); }
.block[hidden]{ display: none; }

.masthead{
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--sp-3);
  padding-bottom: var(--sp-5);
  border-bottom: 1px solid var(--color-rule);
}
.masthead__mark{ font-size: var(--fs-note); color: var(--color-ink-muted); }
.masthead__index{ font-size: var(--fs-note); }

a{
  text-decoration: underline;
  text-decoration-color: var(--color-rule);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}
a:hover, a:focus-visible{
  color: var(--color-accent);
  text-decoration-color: currentColor;
}
a:focus-visible{ outline: 1px solid var(--color-accent); outline-offset: 3px; }

.work-title{
  font-size: var(--fs-question);
  line-height: var(--lh-tight);
  font-weight: 400;
  max-width: 22ch;
}
.work-attribution{
  margin-top: var(--sp-2);
  color: var(--color-ink-muted);
  max-width: 34ch;
}

.editorial p{ max-width: 42ch; }
.editorial p + p{ margin-top: var(--sp-3); }
.editorial dl{
  margin-top: var(--sp-4);
  display: grid;
  grid-template-columns: auto 1fr;
  column-gap: var(--sp-4);
  row-gap: var(--sp-2);
  max-width: 42ch;
}
.editorial dt{
  font-size: var(--fs-note);
  color: var(--color-ink-faint);
  font-style: italic;
  white-space: nowrap;
}
.editorial dd{
  font-size: var(--fs-note);
  color: var(--color-ink-muted);
}

.contents{ display: flex; flex-direction: column; }
.contents li{ border-top: 1px solid var(--color-rule); }
.contents li:last-child{ border-bottom: 1px solid var(--color-rule); }
.contents a, .contents .contents__item{
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--sp-3);
  padding-block: var(--sp-3);
  font-size: var(--fs-title);
  text-decoration: none;
}
.contents a:hover, .contents a:focus-visible{ color: var(--color-accent); }
.contents__num{
  color: var(--color-ink-faint);
  font-size: var(--fs-note);
  flex-shrink: 0;
}
.contents__name{ flex: 1; }
.contents__count{
  font-size: var(--fs-caption);
  color: var(--color-ink-faint);
  font-style: italic;
  flex-shrink: 0;
}

.footer{
  margin-top: var(--sp-7);
  padding-top: var(--sp-3);
  border-top: 1px solid var(--color-rule);
  display: flex;
  justify-content: space-between;
  gap: var(--sp-3);
  font-size: var(--fs-caption);
  color: var(--color-ink-faint);
}

@media (prefers-reduced-motion: no-preference){
  a{ transition: color 150ms ease, text-decoration-color 150ms ease; }
}

@media (max-width: 640px){
  :root{ --fs-body: 1.0625rem; }
  .page{ padding-inline: var(--sp-3); padding-block: var(--sp-4) var(--sp-6); }
  .page > *{ grid-column: 1 / -1; }
  .block + .block{ margin-top: var(--sp-5); }
  .masthead{ flex-direction: column; align-items: flex-start; gap: var(--sp-1); }
  .editorial dl{ grid-template-columns: 1fr; row-gap: var(--sp-1); }
  .editorial dt{ margin-top: var(--sp-2); }
  .footer{ flex-direction: column; gap: var(--sp-1); }
}
</style>
</head>
<body data-slice="work">

<div class="page" id="page">

  <header class="masthead">
    <a class="masthead__mark" href="index.html">Advaita Vedānta — uno studio delle fonti</a>
    <a class="masthead__index" href="index.html">tutti i testi</a>
  </header>

  <!-- TITOLO -->
  <section class="block measure">
    <h1 class="work-title" id="work-title"></h1>
    <p class="work-attribution" id="work-attribution"></p>
  </section>

  <!-- NOTA EDITORIALE -->
  <section class="block measure editorial" id="section-editorial" hidden>
    <div id="editorial-paragraphs"></div>
    <dl id="editorial-dl"></dl>
  </section>

  <!-- INDICE DEI CAPITOLI -->
  <section class="block measure" id="section-contents" hidden>
    <p class="eyebrow">indice</p>
    <ol class="contents" id="contents-list" style="margin-top: var(--sp-3);"></ol>
  </section>

</div>

<footer class="footer measure">
  <span id="footer-name">Advaita Vedānta</span>
  <span>testo tradotto</span>
</footer>

<script src="js/url-router.js"></script>
<script src="js/content-engine.js"></script>
<script>
(function () {
  'use strict';

  function byId(id) { return document.getElementById(id); }

  /**
   * Converte un unit_locus editoriale nei segmenti dell'URL pubblico.
   * Mantiene il formato storico I.4 -> /i/4 e accetta anche locus
   * importati, per esempio 1-18 -> /1-18.
   */
  function localeToPathSegments(locus) {
    if (!locus) return [];
    const normalized = locus.trim();
    const match = /^([IVXLCDM]+)\.(\d+)$/i.exec(normalized);
    return match ? [match[1].toLowerCase(), match[2]] : [normalized.toLowerCase()];
  }

  function createEl(tag, opts) {
    opts = opts || {};
    const el = document.createElement(tag);
    if (opts.class) el.className = opts.class;
    if (opts.text !== undefined) el.textContent = opts.text;
    if (opts.href !== undefined) el.href = opts.href;
    return el;
  }

  function renderError(kind, info) {
    const messages = {
      missing: {
        title: 'Nessuna opera specificata',
        attribution: 'Aggiungi "?rif=<id>" all’indirizzo per aprire un\'opera specifica — per esempio opera.html?rif=brhadaranyaka-upanishad.'
      },
      'not-found': {
        title: 'Opera non trovata',
        attribution: 'Non esiste, in questo studio delle fonti, un\'opera con identificativo "' + (info && info.id) + '".'
      },
      unavailable: {
        title: 'Contenuto momentaneamente non disponibile',
        attribution: (info && info.message) || 'Impossibile caricare i dati dal Content Engine.'
      }
    };
    const m = messages[kind] || messages.unavailable;
    document.title = m.title + ' — Advaita Vedānta';
    byId('work-title').textContent = m.title;
    byId('work-attribution').textContent = m.attribution;
    byId('section-editorial').hidden = true;
    byId('section-contents').hidden = true;
    byId('footer-name').textContent = m.title;
  }

  async function renderWork(work) {
    document.title = work.title + ' — Advaita Vedānta';
    byId('work-title').textContent = work.title;
    byId('work-attribution').textContent = work.attribution || '';
    byId('footer-name').textContent = work.title;

    // Nota editoriale
    const pContainer = byId('editorial-paragraphs');
    const dlContainer = byId('editorial-dl');
    pContainer.replaceChildren();
    dlContainer.replaceChildren();

    const notes = Array.isArray(work.editorial_note) ? work.editorial_note : (work.editorial_note ? [work.editorial_note] : []);
    notes.forEach((text) => {
      pContainer.append(createEl('p', { text: text }));
    });

    const details = work.details || {};
    if (details.structure) {
      dlContainer.append(createEl('dt', { text: 'struttura' }));
      dlContainer.append(createEl('dd', { text: details.structure }));
    }
    if (details.commentary) {
      dlContainer.append(createEl('dt', { text: 'commentario' }));
      dlContainer.append(createEl('dd', { text: details.commentary }));
    }
    if (details.language || work.language) {
      dlContainer.append(createEl('dt', { text: 'lingua' }));
      dlContainer.append(createEl('dd', { text: details.language || work.language }));
    }

    byId('section-editorial').hidden = (!notes.length && !Object.keys(details).length);

    // Indice dei capitoli / sezioni
    const contentsList = byId('contents-list');
    contentsList.replaceChildren();

    // Risoluzione outline / unità
    const outline = work.chapters_outline || [];
    if (outline.length) {
      byId('section-contents').hidden = false;
      outline.forEach((item) => {
        const li = document.createElement('li');
        if (item.available) {
          // Livello capitolo (num. romano, es. "I"): nessuna sezione
          // specifica nota a questo punto senza un fetch aggiuntivo
          // dell'unità — vedi ROUTING.md.
          const a = createEl('a', { href: UrlRouter.buildContentUrl('testi', work.id, [String(item.num).toLowerCase()]) });
          a.append(createEl('span', { class: 'contents__num', text: item.num }));
          a.append(createEl('span', { class: 'contents__name', text: item.name }));
          if (item.count) a.append(createEl('span', { class: 'contents__count', text: item.count }));
          li.append(a);
        } else {
          const div = createEl('div', { class: 'contents__item' });
          div.append(createEl('span', { class: 'contents__num', text: item.num }));
          div.append(createEl('span', { class: 'contents__name', text: item.name }));
          if (item.count) div.append(createEl('span', { class: 'contents__count', text: item.count }));
          li.append(div);
        }
        contentsList.append(li);
      });
    } else if (work.editorial_units && work.editorial_units.length) {
      byId('section-contents').hidden = false;
      for (const unitId of work.editorial_units) {
        const unitResult = await ContentEngine.getUnit(unitId);
        const li = document.createElement('li');
        if (unitResult.status === 'ok') {
          const u = unitResult.data;
          const a = createEl('a', { href: UrlRouter.buildContentUrl('testi', work.id, localeToPathSegments(u.unit_locus)) });
          a.append(createEl('span', { class: 'contents__num', text: u.unit_locus }));
          a.append(createEl('span', { class: 'contents__name', text: u.unit_title }));
          const count = u.sections ? (u.sections.length + ' sezioni') : '';
          if (count) a.append(createEl('span', { class: 'contents__count', text: count }));
          li.append(a);
        }
        contentsList.append(li);
      }
    } else {
      byId('section-contents').hidden = true;
    }
  }

  (async function init() {
    const resolved = UrlRouter.resolveContentId('testi');
    if (!resolved) { renderError('missing'); return; }

    const result = await ContentEngine.getWork(resolved.id);
    if (result.status !== 'ok') { renderError(result.status, result); return; }

    try {
      await renderWork(result.data);
    } catch (error) {
      console.error('Errore nel rendering dell\'opera:', error);
      renderError('unavailable', { message: 'Errore imprevisto nel rendering della pagina.' });
    }
  }());
}());
</script>

</body>
</html>
