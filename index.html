<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Advaita Vedānta — uno studio delle fonti</title>

<!--
  ============================================================
  HOMEPAGE — Advaita Vedānta
  ============================================================
  Markup strutturale e componenti d'interfaccia. Nessun contenuto
  editoriale hardcoded: le domande e le relative costellazioni
  vengono recuperate a runtime tramite js/content-engine.js.
  ============================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gentium+Plus:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

<style>
:root{
  --color-bg:        #F5F3EE;
  --color-bg-raised: #EFECE3;
  --color-ink:        #201F1C;
  --color-ink-muted:  #5B584E;
  --color-ink-faint:  #8B8778;
  --color-accent:     #45516C;
  --color-rule:       #D9D4C6;

  --font-text: 'Gentium Plus', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;

  --fs-question:  clamp(2rem, 4.5vw + 1rem, 3.4rem);
  --fs-entry:     clamp(1.5rem, 2vw + 1rem, 2rem);
  --fs-title:     1.375rem;
  --fs-body:      1.125rem;
  --fs-note:      0.95rem;
  --fs-caption:   0.85rem;

  --lh-tight:  1.25;
  --lh-body:   1.7;

  --sp-1: 0.375rem;
  --sp-2: 0.75rem;
  --sp-3: 1.25rem;
  --sp-4: 2rem;
  --sp-5: 3.25rem;
  --sp-6: 5rem;
  --sp-7: 7.5rem;
  --sp-8: 10rem;

  --measure:   38rem;
  --page-max:  60rem;
}

*, *::before, *::after{ box-sizing: border-box; }
html{ -webkit-text-size-adjust: 100%; }
body{ margin: 0; }
ul{ margin: 0; padding: 0; list-style: none; }
a{ color: inherit; }
h1,h2,p{ margin: 0; }
button{ font: inherit; color: inherit; background: none; border: 0; padding: 0; }

body{
  background: var(--color-bg);
  color: var(--color-ink);
  font-family: var(--font-text);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  font-feature-settings: "onum" 1, "liga" 1;
}

.page{
  display: grid;
  grid-template-columns: minmax(var(--sp-3), 1fr) minmax(0, var(--page-max)) minmax(var(--sp-3), 1fr);
  padding-block: var(--sp-5) var(--sp-7);
  min-height: 100svh;
}
.page > *{ grid-column: 2; }
.measure{ max-width: var(--measure); margin-inline: auto; }
.block + .block{ margin-top: var(--sp-7); }

.masthead{
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--sp-3);
}
.masthead__mark{ font-size: var(--fs-note); color: var(--color-ink-muted); }
.masthead__index{ font-size: var(--fs-note); }

.hero{
  margin-top: var(--sp-8);
}
.hero__name{
  font-size: var(--fs-question);
  line-height: var(--lh-tight);
  font-weight: 400;
  letter-spacing: 0.01em;
}
.hero__desc{
  margin-top: var(--sp-3);
  max-width: 34ch;
  color: var(--color-ink-muted);
}

.entries{
  margin-top: var(--sp-6);
  display: flex;
  flex-direction: column;
}
.entry{
  border-top: 1px solid var(--color-rule);
}
.entry:last-child{ border-bottom: 1px solid var(--color-rule); }

.entry__trigger{
  display: block;
  width: 100%;
  text-align: left;
  padding-block: var(--sp-3);
  font-size: var(--fs-entry);
  line-height: var(--lh-tight);
  cursor: pointer;
}
.entry__trigger:hover,
.entry__trigger:focus-visible{
  color: var(--color-accent);
}
.entry__trigger:focus-visible{ outline: 1px solid var(--color-accent); outline-offset: 4px; }

.entry__constellation{
  overflow: hidden;
  max-height: 0px;
}
.entry__constellation__inner{
  padding-bottom: var(--sp-4);
  padding-left: 0.15em;
}
.entry__hint{
  font-size: var(--fs-note);
  color: var(--color-ink-faint);
  font-style: italic;
  max-width: 40ch;
}
.entry__list{
  margin-top: var(--sp-3);
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}
.entry__list a{
  font-size: var(--fs-title);
  text-decoration: underline;
  text-decoration-color: var(--color-rule);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}
.entry__list a:hover,
.entry__list a:focus-visible{
  color: var(--color-accent);
  text-decoration-color: currentColor;
}
.entry__list a:focus-visible{ outline: 1px solid var(--color-accent); outline-offset: 3px; }

.secondary{
  margin-top: var(--sp-7);
}
.secondary__label{
  font-size: var(--fs-caption);
  color: var(--color-ink-faint);
  font-style: italic;
}
.secondary__list{
  margin-top: var(--sp-2);
  display: flex;
  flex-wrap: wrap;
  column-gap: var(--sp-4);
  row-gap: var(--sp-1);
}
.secondary__list a{
  font-size: var(--fs-note);
  color: var(--color-ink-muted);
  text-decoration: underline;
  text-decoration-color: var(--color-rule);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}
.secondary__list a:hover,
.secondary__list a:focus-visible{
  color: var(--color-accent);
  text-decoration-color: currentColor;
}

.footer{
  margin-top: var(--sp-7);
  padding-top: var(--sp-3);
  border-top: 1px solid var(--color-rule);
  display: flex;
  justify-content: space-between;
  gap: var(--sp-3);
  font-size: var(--fs-caption);
  color: var(--color-ink-faint);
}

@media (prefers-reduced-motion: no-preference){
  .entry__trigger{ transition: color 150ms ease; }
  .entry__constellation{ transition: max-height 320ms ease; }
  .secondary__list a{ transition: color 150ms ease, text-decoration-color 150ms ease; }
}

@media (max-width: 640px){
  :root{ --fs-body: 1.0625rem; }
  .page{ padding-inline: var(--sp-3); padding-block: var(--sp-4) var(--sp-6); }
  .page > *{ grid-column: 1 / -1; }
  .hero{ margin-top: var(--sp-6); }
  .block + .block{ margin-top: var(--sp-6); }
  .masthead{ flex-direction: column; align-items: flex-start; gap: var(--sp-1); }
  .footer{ flex-direction: column; gap: var(--sp-1); }
  .secondary__list{ flex-direction: column; gap: var(--sp-2); }
}
</style>
</head>
<body>

<div class="page">

  <header class="masthead">
    <span class="masthead__mark">Advaita Vedānta — uno studio delle fonti</span>
    <a class="masthead__index" href="#entries-container">indice delle domande</a>
  </header>

  <!-- PRIMO SCHERMO -->
  <section class="hero measure">
    <h1 class="hero__name">Advaita Vedānta</h1>
    <p class="hero__desc">
      Un percorso attraverso le domande fondamentali e le fonti
      della tradizione.
    </p>
  </section>

  <!-- LE DOMANDE FONDAMENTALI (recuperate dinamicamente dal Content Engine) -->
  <nav class="entries measure" aria-label="Domande fondamentali" id="entries-container"></nav>

  <!-- ACCESSO SECONDARIO -->
  <section class="secondary measure">
    <p class="secondary__label">altri percorsi</p>
    <ul class="secondary__list">
      <li data-home-link="work"><a href="#">Leggere i testi</a></li>
      <li data-home-link="author"><a href="#">Esplorare gli autori</a></li>
      <li data-home-link="concept"><a href="#">Seguire un concetto</a></li>
    </ul>
  </section>

  <footer class="footer measure">
    <span>Advaita Vedānta</span>
    <span>uno studio delle fonti</span>
  </footer>

</div>

<script src="/js/url-router.js"></script>
<script src="/js/content-engine.js"></script>
<script>
(function () {
  'use strict';

  const container = document.getElementById('entries-container');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function createEl(tag, opts) {
    opts = opts || {};
    const el = document.createElement(tag);
    if (opts.class) el.className = opts.class;
    if (opts.text !== undefined) el.textContent = opts.text;
    if (opts.href !== undefined) el.href = opts.href;
    return el;
  }

  function questionUrl(id) {
    return UrlRouter.buildContentUrl('domande', id);
  }

  const HOME_LINKS = {
    work: 'testi',
    author: 'autori',
    concept: 'concetti'
  };

  async function loadHomeLinks() {
    await Promise.all(Object.entries(HOME_LINKS).map(async ([kind, prefix]) => {
      const item = document.querySelector('[data-home-link="' + kind + '"]');
      const result = await ContentEngine.getEntities(kind);
      if (!item || result.status !== 'ok' || !result.data.length) {
        if (item) item.hidden = true;
        return;
      }
      item.querySelector('a').href = UrlRouter.buildContentUrl(prefix, result.data[0].id);
    }));
  }

  async function loadHomeQuestions() {
    // L'homepage si popola dall'indice: l'importazione di nuovi testi
    // non richiede di aggiornare qui alcun ID editoriale.
    const questionsResult = await ContentEngine.getEntities('question');
    if (questionsResult.status !== 'ok') return;
    const greatQuestions = questionsResult.data.filter((question) => question.type === 'great');
    container.replaceChildren();

    for (const question of greatQuestions) {

      const entry = createEl('div', { class: 'entry' });
      const trigger = createEl('button', { class: 'entry__trigger', text: question.text });
      trigger.setAttribute('aria-expanded', 'false');

      const constellation = createEl('div', { class: 'entry__constellation' });
      const inner = createEl('div', { class: 'entry__constellation__inner' });
      inner.append(createEl('p', { class: 'entry__hint', text: 'Questioni in cui questa domanda si specifica:' }));

      const list = createEl('ul', { class: 'entry__list' });

      // Domande collegate, espresse nel pacchetto editoriale come ID.
      for (const ref of (question.related_questions || [])) {
        const sqId = typeof ref === 'string' ? ref : ref.id;
        const sqRes = await ContentEngine.getQuestion(sqId);
        if (sqRes.status === 'ok') {
          const li = document.createElement('li');
          li.append(createEl('a', { href: questionUrl(sqRes.data.id), text: sqRes.data.text }));
          list.append(li);
        }
      }

      // Link diretto alla domanda principale
      const liMain = document.createElement('li');
      liMain.style.marginTop = 'var(--sp-2)';
      liMain.append(createEl('a', { href: questionUrl(question.id), text: 'Esplora la domanda complessiva →' }));
      list.append(liMain);

      inner.append(list);
      constellation.append(inner);
      entry.append(trigger, constellation);
      container.append(entry);

      trigger.addEventListener('click', () => {
        const isOpen = trigger.getAttribute('aria-expanded') === 'true';
        trigger.setAttribute('aria-expanded', String(!isOpen));
        if (reduce) return;
        constellation.style.maxHeight = !isOpen ? constellation.scrollHeight + 'px' : '0px';
      });
    }
  }

  Promise.all([loadHomeQuestions(), loadHomeLinks()])
    .catch((err) => console.error('Errore nel caricamento della homepage:', err));
}());
</script>

</body>
</html>
