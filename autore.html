<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Autore — Advaita Vedānta</title>

<!--
  ============================================================
  TEMPLATE DINAMICO — Pagina di Autore (tipo AUTHOR)
  ============================================================
  Sostituisce le pagine statiche individuali per singolo autore
  (es. autore-shankara.html): non esiste più una pagina HTML
  distinta per ogni autore, esiste questo unico template dinamico.

  Il contenuto è determinato dallo slug in query string:
      autore.html?rif=<id-autore>

  Il markup non contiene contenuti hardcoded. I dati provengono
  esclusivamente da js/content-engine.js.
  ============================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gentium+Plus:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

<style>
:root{
  --color-bg:        #F5F3EE;
  --color-bg-raised: #EFECE3;
  --color-ink:        #201F1C;
  --color-ink-muted:  #5B584E;
  --color-ink-faint:  #8B8778;
  --color-accent:     #45516C;
  --color-rule:       #D9D4C6;

  --font-text: 'Gentium Plus', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;

  --fs-concept:   clamp(2.25rem, 5vw + 1rem, 3.8rem);
  --fs-title:     1.375rem;
  --fs-body:      1.125rem;
  --fs-note:      0.95rem;
  --fs-caption:   0.85rem;

  --lh-tight:  1.25;
  --lh-body:   1.7;

  --sp-1: 0.375rem;
  --sp-2: 0.75rem;
  --sp-3: 1.25rem;
  --sp-4: 2rem;
  --sp-5: 3.25rem;
  --sp-6: 5rem;
  --sp-7: 7.5rem;

  --measure:   38rem;
  --page-max:  60rem;
}

*, *::before, *::after{ box-sizing: border-box; }
html{ -webkit-text-size-adjust: 100%; }
body{ margin: 0; }
ul{ margin: 0; padding: 0; list-style: none; }
a{ color: inherit; }
h1,p{ margin: 0; }

body{
  background: var(--color-bg);
  color: var(--color-ink);
  font-family: var(--font-text);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  font-feature-settings: "onum" 1, "liga" 1;
}

.eyebrow{
  font-size: var(--fs-caption);
  color: var(--color-ink-faint);
  font-style: italic;
}

.page{
  display: grid;
  grid-template-columns: minmax(var(--sp-3), 1fr) minmax(0, var(--page-max)) minmax(var(--sp-3), 1fr);
  padding-block: var(--sp-5) var(--sp-7);
}
.page > *{ grid-column: 2; }
.measure{ max-width: var(--measure); margin-inline: auto; }
.block + .block{ margin-top: var(--sp-6); }
.block[hidden]{ display: none; }

a{
  text-decoration: underline;
  text-decoration-color: var(--color-rule);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}
a:hover, a:focus-visible{
  color: var(--color-accent);
  text-decoration-color: currentColor;
}
a:focus-visible{ outline: 1px solid var(--color-accent); outline-offset: 3px; }

a.concept{
  text-decoration-style: dotted;
  text-decoration-color: var(--color-ink-faint);
}
a.concept:hover, a.concept:focus-visible{ text-decoration-style: solid; }

.masthead{
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--sp-3);
  padding-bottom: var(--sp-5);
  border-bottom: 1px solid var(--color-rule);
  font-size: var(--fs-note);
}
.masthead__mark{ color: var(--color-ink-muted); }

.author-name{
  font-size: var(--fs-concept);
  line-height: var(--lh-tight);
  font-weight: 400;
}
.author-name__translit{
  display: block;
  font-size: var(--fs-note);
  color: var(--color-ink-faint);
  font-style: italic;
  margin-top: var(--sp-1);
}

.context{
  margin-top: var(--sp-3);
  color: var(--color-ink-muted);
  max-width: 46ch;
}

.approach__list{ display: flex; flex-direction: column; }
.approach__list li{ border-top: 1px solid var(--color-rule); }
.approach__list li:last-child{ border-bottom: 1px solid var(--color-rule); }
.approach__list a{
  display: block;
  padding-block: var(--sp-2);
  font-size: var(--fs-title);
  text-decoration: none;
}
.approach__list a:hover, .approach__list a:focus-visible{ color: var(--color-accent); }

.periphery{
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--sp-4);
  max-width: var(--page-max);
  margin-inline: auto;
}
@media (min-width: 800px){
  .periphery{ grid-template-columns: 1fr 1fr; }
}
.aside-block__label{ font-size: var(--fs-caption); color: var(--color-ink-faint); font-style: italic; }
.aside-block__items{ margin-top: var(--sp-2); display: flex; flex-direction: column; gap: var(--sp-2); }
.aside-block__items .source__why{
  display: block;
  margin-top: var(--sp-1);
  font-size: var(--fs-caption);
  color: var(--color-ink-faint);
}
.aside-block__items .unavailable{
  display: block;
  color: var(--color-ink);
}

.crossings{
  padding-top: var(--sp-4);
  border-top: 1px solid var(--color-rule);
}
.crossings__lead{
  font-size: var(--fs-caption);
  color: var(--color-ink-faint);
  font-style: italic;
}
.crossings__list{
  margin-top: var(--sp-3);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}
.crossing__link{
  font-size: var(--fs-title);
  text-decoration: underline;
  text-decoration-color: var(--color-rule);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}
.crossing__link:hover, .crossing__link:focus-visible{
  color: var(--color-accent);
  text-decoration-color: currentColor;
}
.crossing__link:focus-visible{ outline: 1px solid var(--color-accent); outline-offset: 3px; }
.crossing__link.unavailable{
  text-decoration: none;
  color: var(--color-ink);
}
.crossing__why{
  display: block;
  margin-top: var(--sp-1);
  font-size: var(--fs-note);
  color: var(--color-ink-muted);
  max-width: 46ch;
}

.footer{
  margin-top: var(--sp-7);
  padding-top: var(--sp-3);
  border-top: 1px solid var(--color-rule);
  display: flex;
  justify-content: space-between;
  gap: var(--sp-3);
  font-size: var(--fs-caption);
  color: var(--color-ink-faint);
}

@media (prefers-reduced-motion: no-preference){
  a{ transition: color 150ms ease, text-decoration-color 150ms ease; }
}

@media (max-width: 640px){
  :root{ --fs-body: 1.0625rem; }
  .page{ padding-inline: var(--sp-3); padding-block: var(--sp-4) var(--sp-6); }
  .page > *{ grid-column: 1 / -1; }
  .block + .block{ margin-top: var(--sp-5); }
  .masthead{ flex-direction: column; align-items: flex-start; gap: var(--sp-1); }
  .footer{ flex-direction: column; gap: var(--sp-1); }
}
</style>
</head>
<body data-slice="author">

<div class="page" id="page">

  <header class="masthead">
    <a class="masthead__mark" href="/">Advaita Vedānta — uno studio delle fonti</a>
    <a href="/">tutti gli autori</a>
  </header>

  <!-- IL NOME -->
  <section class="block measure">
    <p class="eyebrow" id="author-eyebrow"></p>
    <h1 class="author-name">
      <span id="author-title"></span>
      <span class="author-name__translit" id="author-transliteration" hidden></span>
    </h1>
    <p class="context" id="author-context"></p>
  </section>

  <!-- DOMANDE: peso maggiore -->
  <section class="block measure" id="section-questions" hidden>
    <p class="eyebrow">domande in cui il suo commento è particolarmente rilevante</p>
    <ul class="approach__list" id="questions-list" style="margin-top: var(--sp-3);"></ul>
  </section>

  <!-- OPERE / CONCETTI: due liste periferiche -->
  <section class="block periphery" id="section-periphery" hidden>

    <div class="aside-block" id="aside-works">
      <p class="aside-block__label">opere</p>
      <ul class="aside-block__items" id="works-list"></ul>
    </div>

    <div class="aside-block" id="aside-concepts">
      <p class="aside-block__label">concetti fondamentali</p>
      <ul class="aside-block__items" id="concepts-list"></ul>
    </div>

  </section>

  <!-- RAPPORTO CON ALTRI AUTORI -->
  <section class="block measure crossings" id="section-crossings" hidden>
    <p class="crossings__lead">rapporto con altri autori</p>
    <ul class="crossings__list" id="crossings-list"></ul>
  </section>

</div>

<footer class="footer measure">
  <span id="footer-name">Advaita Vedānta</span>
  <span>autore</span>
</footer>

<script src="/js/url-router.js"></script>
<script src="/js/content-engine.js"></script>
<script>
(function () {
  'use strict';

  function byId(id) { return document.getElementById(id); }

  function createEl(tag, opts) {
    opts = opts || {};
    const el = document.createElement(tag);
    if (opts.class) el.className = opts.class;
    if (opts.text !== undefined) el.textContent = opts.text;
    if (opts.href !== undefined) el.href = opts.href;
    return el;
  }

  function questionUrl(id) {
    return UrlRouter.buildContentUrl('domande', id);
  }

  function conceptUrl(id) {
    return UrlRouter.buildContentUrl('concetti', id);
  }

  function workUrl(id) {
    return UrlRouter.buildContentUrl('testi', id);
  }

  function authorUrl(id) {
    return UrlRouter.buildContentUrl('autori', id);
  }

  function renderError(kind, info) {
    const messages = {
      missing: {
        title: 'Nessun autore specificato',
        context: 'Aggiungi "?rif=<id>" all’indirizzo per aprire un autore specifico — per esempio autore.html?rif=shankara.'
      },
      'not-found': {
        title: 'Autore non trovato',
        context: 'Non esiste, in questo studio delle fonti, un autore con identificativo "' + (info && info.id) + '".'
      },
      unavailable: {
        title: 'Contenuto momentaneamente non disponibile',
        context: (info && info.message) || 'Impossibile caricare i dati dal Content Engine.'
      }
    };
    const m = messages[kind] || messages.unavailable;
    document.title = m.title + ' — Advaita Vedānta';
    byId('author-eyebrow').textContent = '';
    byId('author-title').textContent = m.title;
    byId('author-transliteration').hidden = true;
    byId('author-context').textContent = m.context;
    byId('section-questions').hidden = true;
    byId('section-periphery').hidden = true;
    byId('section-crossings').hidden = true;
    byId('footer-name').textContent = m.title;
  }

  async function renderAuthor(author) {
    document.title = author.name + ' — Advaita Vedānta';
    byId('author-eyebrow').textContent = author.role_description || author.role || 'autore tradizionale';
    byId('author-title').textContent = author.name;
    byId('footer-name').textContent = author.name;

    if (author.transliteration) {
      byId('author-transliteration').textContent = author.transliteration;
      byId('author-transliteration').hidden = false;
    } else {
      byId('author-transliteration').hidden = true;
    }

    byId('author-context').textContent = author.context || '';

    // Domande rilevanti: raccolte da concetti e commentari dell'autore
    const qList = byId('questions-list');
    qList.replaceChildren();

    const seenQuestionIds = new Set();
    const questions = [];

    // Dai concetti dell'autore
    const conceptsResult = await ContentEngine.getAuthorConcepts(author.id);
    const conceptIds = conceptsResult.status === 'ok' ? conceptsResult.data : (author.concepts || []);
    for (const cid of conceptIds) {
      const qRes = await ContentEngine.getConceptQuestions(cid);
      if (qRes.status === 'ok') {
        for (const qid of qRes.data) {
          if (!seenQuestionIds.has(qid)) {
            seenQuestionIds.add(qid);
            const q = await ContentEngine.getQuestion(qid);
            if (q.status === 'ok') questions.push(q.data);
          }
        }
      }
    }

    if (questions.length) {
      byId('section-questions').hidden = false;
      questions.forEach((q) => {
        const li = document.createElement('li');
        li.append(createEl('a', { href: questionUrl(q.id), text: q.text }));
        qList.append(li);
      });
    } else {
      byId('section-questions').hidden = true;
    }

    // Periferia: Opere e Concetti
    const worksList = byId('works-list');
    const conceptsList = byId('concepts-list');
    worksList.replaceChildren();
    conceptsList.replaceChildren();

    let hasPeriphery = false;

    // 1. Opere
    const authorWorksResult = await ContentEngine.getAuthorWorks(author.id);
    const workIds = authorWorksResult.status === 'ok' ? authorWorksResult.data : (author.works || []);
    for (const wid of workIds) {
      const wRes = await ContentEngine.getWork(wid);
      if (wRes.status === 'ok') {
        const li = document.createElement('li');
        li.append(createEl('a', { class: 'source__title', href: workUrl(wid), text: wRes.data.title }));
        li.append(createEl('span', { class: 'source__why', text: 'commento leggibile all’interno dei passaggi del testo' }));
        worksList.append(li);
        hasPeriphery = true;
      }
    }
    (author.pending_works || []).forEach((pw) => {
      const li = document.createElement('li');
      li.append(createEl('span', { class: 'unavailable', text: pw.title }));
      if (pw.note) {
        li.append(createEl('span', { class: 'source__why', text: pw.note }));
      }
      worksList.append(li);
      hasPeriphery = true;
    });

    // 2. Concetti
    for (const cid of conceptIds) {
      const cRes = await ContentEngine.getConcept(cid);
      if (cRes.status === 'ok') {
        const li = document.createElement('li');
        li.append(createEl('a', { class: 'concept', href: conceptUrl(cid), text: cRes.data.name }));
        conceptsList.append(li);
        hasPeriphery = true;
      }
    }
    (author.pending_concepts || []).forEach((pc) => {
      const li = document.createElement('li');
      li.append(createEl('span', { class: 'concept unavailable', text: pc.name }));
      conceptsList.append(li);
      hasPeriphery = true;
    });

    byId('section-periphery').hidden = !hasPeriphery;

    // Rapporto con altri autori
    const crossingsList = byId('crossings-list');
    crossingsList.replaceChildren();
    let hasCrossings = false;

    for (const aid of (author.related_authors || [])) {
      const aRes = await ContentEngine.getAuthor(aid);
      if (aRes.status === 'ok') {
        const li = document.createElement('li');
        li.append(createEl('a', { class: 'crossing__link', href: authorUrl(aid), text: aRes.data.name }));
        crossingsList.append(li);
        hasCrossings = true;
      }
    }
    (author.pending_related_authors || []).forEach((pra) => {
      const li = document.createElement('li');
      li.append(createEl('span', { class: 'crossing__link unavailable', text: pra.name }));
      if (pra.why) {
        li.append(createEl('span', { class: 'crossing__why', text: pra.why }));
      }
      crossingsList.append(li);
      hasCrossings = true;
    });

    byId('section-crossings').hidden = !hasCrossings;
  }

  (async function init() {
    const resolved = UrlRouter.resolveContentId('autori');
    if (!resolved) { renderError('missing'); return; }

    const result = await ContentEngine.getAuthor(resolved.id);
    if (result.status !== 'ok') { renderError(result.status, result); return; }

    try {
      await renderAuthor(result.data);
    } catch (error) {
      console.error('Errore nel rendering dell\'autore:', error);
      renderError('unavailable', { message: 'Errore imprevisto nel rendering della pagina.' });
    }
  }());
}());
</script>

</body>
</html>
