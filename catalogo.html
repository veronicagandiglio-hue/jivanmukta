<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Indice — Advaita Vedanta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gentium+Plus:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --color-bg:#F5F3EE;
  --color-ink:#201F1C;
  --color-ink-muted:#5B584E;
  --color-ink-faint:#8B8778;
  --color-accent:#45516C;
  --color-rule:#D9D4C6;
  --font-text:'Gentium Plus','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --measure:38rem;
  --page-max:60rem;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--color-bg);color:var(--color-ink);font-family:var(--font-text);font-size:1.125rem;line-height:1.7}
a{color:inherit}
h1,p{margin:0}
.page{display:grid;grid-template-columns:minmax(1.25rem,1fr) minmax(0,var(--page-max)) minmax(1.25rem,1fr);padding-block:3.25rem 7.5rem;min-height:100svh}
.page>*{grid-column:2}
.measure{max-width:var(--measure);margin-inline:auto;width:100%}
.masthead{display:flex;justify-content:space-between;align-items:baseline;gap:1.25rem;font-size:.95rem;color:var(--color-ink-muted)}
.masthead a{text-decoration-color:var(--color-rule);text-underline-offset:.15em}
.intro{margin-top:7.5rem}
.intro h1{font-size:clamp(2.5rem,5vw,4rem);font-weight:400;line-height:1.2}
.intro p{margin-top:1.25rem;color:var(--color-ink-muted);max-width:35ch}
.catalog{margin-top:5rem;border-top:1px solid var(--color-rule)}
.catalog__item{display:block;padding:1.25rem 0;border-bottom:1px solid var(--color-rule);text-decoration:none}
.catalog__item:hover,.catalog__item:focus-visible{color:var(--color-accent)}
.catalog__name{font-size:2rem;line-height:1.25}
.catalog__meta{margin-top:.25rem;color:var(--color-ink-faint);font-size:.95rem}
.catalog-group + .catalog-group{margin-top:4rem;padding-top:2.5rem;border-top:1px solid var(--color-rule)}
.catalog-group h2{font-size:1.65rem;font-weight:400;line-height:1.3}
.catalog-group__desc{margin-top:.5rem;max-width:62ch;color:var(--color-ink-muted);font-size:1rem}
.catalog-group__items{margin-top:1.5rem;border-top:1px solid var(--color-rule)}
.catalog-group__note{margin-top:1rem;color:var(--color-ink-muted);font-size:1rem}
.catalog-group__link{display:inline-block;margin-top:.75rem}
.status{padding-block:1.25rem;color:var(--color-ink-muted);font-style:italic}
@media(max-width:640px){
  .page{padding:2rem 1.25rem 5rem}
  .masthead{align-items:flex-start;flex-direction:column;gap:.25rem}
  .intro{margin-top:5rem}
  .catalog{margin-top:3.25rem}
  .catalog__name{font-size:1.5rem}
}
</style>
</head>
<body>
<main class="page">
  <header class="masthead measure">
    <a href="/">Advaita Vedanta — uno studio delle fonti</a>
    <a href="/">torna all'inizio</a>
  </header>
  <section class="intro measure">
    <h1 id="catalog-title">Indice</h1>
    <p id="catalog-description"></p>
  </section>
  <nav class="catalog measure" id="catalog" aria-label="Indice dei contenuti"></nav>
</main>
<script src="/js/url-router.js"></script>
<script src="/js/content-engine.js"></script>
<script>
(function () {
  'use strict';

  const config = {
    testi: {
      kind: 'work',
      title: 'I testi',
      description: 'Le opere attraverso cui si articola lo studio delle fonti.',
      label: function (item) { return item.title || item.name || item.id; },
      url: function (item) { return UrlRouter.buildContentUrl('testi', item.id); }
    },
    autori: {
      kind: 'author',
      title: 'Gli autori',
      description: 'Gli autori e le figure della tradizione presenti nel corpus.',
      label: function (item) { return item.name || item.title || item.id; },
      url: function (item) { return UrlRouter.buildContentUrl('autori', item.id); }
    },
    concetti: {
      kind: 'concept',
      title: 'I concetti',
      description: 'I concetti dottrinali che orientano la lettura delle fonti.',
      label: function (item) { return item.name || item.title || item.id; },
      url: function (item) { return UrlRouter.buildContentUrl('concetti', item.id); }
    }
  };

  const path = window.location.pathname.replace(/\/+$/, '');
  const pathType = path === '/concetti' ? 'concetti' : path === '/autori' ? 'autori' : path === '/testi' ? 'testi' : null;
  const type = pathType || new URLSearchParams(window.location.search).get('tipo') || 'testi';
  const current = config[type] || config.testi;
  const title = document.getElementById('catalog-title');
  const description = document.getElementById('catalog-description');
  const catalog = document.getElementById('catalog');

  document.title = current.title + ' — Advaita Vedanta';
  title.textContent = current.title;
  description.textContent = current.description;

  ContentEngine.getEntities(current.kind).then(function (result) {
    if (result.status !== 'ok') {
      catalog.textContent = 'Il catalogo non è momentaneamente disponibile.';
      return;
    }

    const items = result.data.slice().sort(function (left, right) {
      return String(current.label(left)).localeCompare(String(current.label(right)), 'it');
    });

    if (!items.length) {
      catalog.textContent = 'Non ci sono ancora elementi in questo catalogo.';
      return;
    }

    function makeItem(item) {
      const link = document.createElement('a');
      link.className = 'catalog__item';
      link.href = current.url(item);

      const name = document.createElement('span');
      name.className = 'catalog__name';
      name.textContent = current.label(item);
      link.append(name);

      const meta = document.createElement('span');
      meta.className = 'catalog__meta';
      meta.textContent = item.short_title || item.transliteration || item.id;
      link.append(meta);
      return link;
    }

    if (type === 'testi') {
      catalog.replaceChildren();
      function appendGroup(titleText, descriptionText, groupItems, emptyText) {
        const section = document.createElement('section');
        section.className = 'catalog-group';
        const heading = document.createElement('h2');
        heading.textContent = titleText;
        section.append(heading);
        const intro = document.createElement('p');
        intro.className = 'catalog-group__desc';
        intro.textContent = descriptionText;
        section.append(intro);
        const list = document.createElement('div');
        list.className = 'catalog-group__items';
        groupItems.forEach((item) => list.append(makeItem(item)));
        if (!groupItems.length && emptyText) {
          const note = document.createElement('p');
          note.className = 'catalog-group__note';
          note.textContent = emptyText;
          list.append(note);
        }
        section.append(list);
        catalog.append(section);
        return section;
      }

      const typeOf = (item) => item.source_type || (item.id === 'introduzione-generale-allo-studio-delle-dottrine-indu' ? 'modern_study' : /upanishad|upanisad/i.test(item.id) ? 'upanishad' : 'other');
      const upanishads = items.filter((item) => typeOf(item) === 'upanishad');
      const commentaries = items.filter((item) => typeOf(item) === 'traditional_commentary');
      const studies = items.filter((item) => typeOf(item) === 'modern_study');
      const other = items.filter((item) => !['upanishad', 'traditional_commentary', 'modern_study'].includes(typeOf(item)));

      appendGroup('Upaniṣad — fonti primarie', 'I testi vedici alla base dell’insegnamento del Vedānta. I riti, le meditazioni e le descrizioni cosmologiche che vi compaiono vanno letti nel loro contesto: non sono un secondo nucleo assoluto accanto a Brahman.', upanishads);
      const commentarySection = appendGroup('Commenti tradizionali — Śaṅkara', 'Interpretazioni tradizionali dei testi upaniṣadici, distinte sia dalle fonti commentate sia dagli studi moderni.', commentaries, 'I commenti selezionati di Śaṅkara sono associati ai passi delle Upaniṣad; non è ancora presente un’edizione integrale autonoma.');
      const authorLink = document.createElement('a');
      authorLink.className = 'catalog-group__link';
      authorLink.href = '/autori/adi-shankara';
      authorLink.textContent = 'Vedi Śaṅkara e i commenti selezionati →';
      commentarySection.append(authorLink);
      appendGroup('Studi moderni — René Guénon', 'Testi moderni di orientamento metafisico. Sono contributi interpretativi e non Upaniṣad né commentari tradizionali.', studies);
      if (other.length) appendGroup('Altri testi', 'Altri materiali presenti nel catalogo.', other);
      return;
    }

    items.forEach(function (item) { catalog.append(makeItem(item)); });
  }).catch(function () {
    catalog.textContent = 'Il catalogo non è momentaneamente disponibile.';
  });
}());
</script>
<script src="/js/glossary-popovers.js" defer></script>
</body>
</html>
